name: Repost Bosnia Message

on:
  workflow_dispatch:

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old message and repost
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          CHANNEL="C0B97JGMG1F"

          # Delete the broken message
          curl -s -X POST https://slack.com/api/chat.delete \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"channel":"C0B97JGMG1F","ts":"1783128358.938469"}'
          echo

          # Repost with correct flag and owner
          MSG=":us: *United States* 2–0 *Bosnia & Herzegovina* :flag-ba:\n:date: 2 Jul · Round of 32 · #FIFAWorldCup2026\n\n:trophy: *United States* advance to the next round!\n:skull: :flag-ba: Bosnia & Herzegovina are eliminated — tough luck *Anchal Soni*! :cry:\n:soccer: :us: F. Balogun 45' · :us: M. Tillman 82'\n:eyes: Sweepstake watch: :us: belongs to *Nick Parker* · :flag-ba: belongs to *Anchal Soni*\n<https://varund13.github.io/veridoohworldcupsweepstake/|📊 View the bracket>"

          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"channel\":\"$CHANNEL\",\"text\":\"$MSG\"}"
          echo
