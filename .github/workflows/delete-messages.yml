name: Delete Slack Messages

on:
  workflow_dispatch:
    inputs:
      timestamps:
        description: 'Comma-separated message timestamps to delete'
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete messages
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          CHANNEL="C0B97JGMG1F"
          IFS=',' read -ra TSS <<< "${{ github.event.inputs.timestamps }}"
          for TS in "${TSS[@]}"; do
            TS=$(echo "$TS" | xargs)
            echo "Deleting $TS..."
            curl -s -X POST https://slack.com/api/chat.delete \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "{\"channel\":\"$CHANNEL\",\"ts\":\"$TS\"}"
            echo
          done
